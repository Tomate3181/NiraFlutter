name: nira_flutter
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Banco de Dados e Realtime (Substitui o supabase-js)
  supabase_flutter: ^2.12.4

  # Gerenciamento de Estado Reativo e Caching
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Tipagem Segura e Serialização de JSON
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # Mapas e Geolocalização (Substitui o react-leaflet)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # Inteligência Artificial (Substitui o SDK do Gemini em JS)
  google_generative_ai: ^0.4.7

  # Interface Avançada e Utilitários (Substitui Recharts, Lucide, Framer Motion)
  fl_chart: ^1.2.0
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.2
  responsive_framework: ^1.5.1
  riverpod: ^3.2.1
  go_router: ^7.0.0
  flutter_dotenv: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Geradores de Código Automático (Garante zero bugs de tipagem manual)
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  json_serializable: ^6.14.0
  freezed: ^3.2.5


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
